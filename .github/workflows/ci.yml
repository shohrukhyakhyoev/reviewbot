name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned: `ubuntu-latest` migrates to Ubuntu 26 on 2026-10-19. Both images ship Docker,
    # so Testcontainers-based integration tests run here.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven # ~/.m2/repository, keyed on all pom.xml files

      # setup-java's cache does not cover the Maven distribution the wrapper downloads.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      # Fast-fail lint: format violations are reported before anything compiles.
      - name: Format check (Spotless)
        run: ./mvnw -B -ntp spotless:check

      # Tests + JaCoCo report + engine branch rule (jacoco-check-engine) + Spotless again.
      - name: Build and test
        run: ./mvnw -B -ntp clean verify

      - name: Coverage gate (overall line >= 80%)
        run: .github/scripts/coverage-gate.sh 80

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore

  # E2-4: topic provisioning is idempotent and never alters an existing topic (spec §4.1, §4.4).
  # Independent of `verify` (no Maven), so it runs in parallel with it.
  kafka-topics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Only the broker: the script is run (twice) by verify-topics.sh itself.
      - name: Start Kafka
        run: docker compose -f infra/docker-compose.yml up -d --wait kafka

      # prod render assertion -> run 1 creates -> --describe assertions -> run 2 is a no-op
      # -> a wrong-partition-count topic is refused, not altered.
      - name: Provision twice and assert topic config
        run: EXPECT_FRESH=1 bash infra/kafka/verify-topics.sh

      - name: Kafka logs
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs kafka

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
